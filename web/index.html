<!DOCTYPE html>
<html>
<head>

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- viewport-fit=cover lets the app draw under the notch and the home
       indicator. Flutter keeps the rest of its viewport settings, carries this
       one over, and reports the safe area to SafeArea and AppBar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Reclaiming language learning. No hearts, no energy, just pure open-source education for Indian and underrepresented languages.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- From the home screen: the app runs under the status bar rather than
       below a black strip. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F5FDFB">
  <meta name="apple-mobile-web-app-title" content="Varnamala">
  <meta name="google-signin-client_id" content="810080914897-hi79u9dqg8vvhk0ae24krftavedq63q8.apps.googleusercontent.com">
  <!-- Warm up Google Identity and the font origin used during startup. Flutter's
       generated loader selects and fetches either Wasm or the JavaScript
       fallback, so do not preload one compilation target here. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Varnamala | Reclaiming Language Learning</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preserve old shared/bookmarked hash routes after moving to clean paths.
       replaceState avoids a network round trip before Flutter starts. -->
  <script>
    if (window.location.hash.startsWith('#/')) {
      window.history.replaceState(null, '', window.location.hash.slice(1));
    }
  </script>

  <style>
    /* The colour before the app starts. Once it has, BrowserChromeSync repaints
       html, body and theme-color in the theme's app-bar colour. */
    html, body {
      background-color: #F5FDFB;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    }
    .loading {
      text-align: center;
      color: #1F727E; /* Peacock Teal */
    }
    .spinner {
      border: 4px solid #E5E5E5;
      border-radius: 50%;
      border-top: 4px solid #1F727E;
      width: 40px;
      height: 40px;
      -webkit-animation: spin 1s linear infinite; /* Safari */
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    /* Safari */
    @-webkit-keyframes spin {
      0% { -webkit-transform: rotate(0deg); }
      100% { -webkit-transform: rotate(360deg); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 { margin: 0; font-size: 24px; color: #1F727E; }
    p { margin-top: 10px; color: #4A5568; }
  </style>

</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <h1>Varnamala</h1>
    <p>Reclaiming Language Learning...</p>
  </div>

  <!-- Start Flutter as soon as its bootstrap is available instead of waiting
       for every page resource to fire the window load event. -->
  <script src="flutter_bootstrap.js" async></script>
  <!-- The loader sits under Flutter's canvas, so without this it shows through
       every screen that has no background of its own. -->
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.querySelector('.loading')?.remove();
    }, { once: true });
  </script>
</body>
</html>
