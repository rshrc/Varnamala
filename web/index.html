<!DOCTYPE html>
<html>
<head>

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Reclaiming language learning. No hearts, no energy, just pure open-source education for Indian and underrepresented languages.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#1F727E">
  <meta name="apple-mobile-web-app-title" content="Varnamala">
  <meta name="google-signin-client_id" content="810080914897-hi79u9dqg8vvhk0ae24krftavedq63q8.apps.googleusercontent.com">
  <!-- Warm up the origins used during startup: Flutter/Firebase, Google
       Identity, and the Nunito font used on the first screen. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Varnamala | Reclaiming Language Learning</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #F5FDFB; /* Scaffold background */
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    }
    .loading {
      text-align: center;
      color: #1F727E; /* Peacock Teal */
    }
    .spinner {
      border: 4px solid #E5E5E5;
      border-radius: 50%;
      border-top: 4px solid #1F727E;
      width: 40px;
      height: 40px;
      -webkit-animation: spin 1s linear infinite; /* Safari */
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    /* Safari */
    @-webkit-keyframes spin {
      0% { -webkit-transform: rotate(0deg); }
      100% { -webkit-transform: rotate(360deg); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 { margin: 0; font-size: 24px; color: #1F727E; }
    p { margin-top: 10px; color: #4A5568; }
  </style>

</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <h1>Varnamala</h1>
    <p>Reclaiming Language Learning...</p>
  </div>

  <!-- Start Flutter as soon as its bootstrap is available instead of waiting
       for every page resource to fire the window load event. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
