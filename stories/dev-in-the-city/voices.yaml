# How Dev in the City sounds: read by tool/render_katha_audio.rb, never by the app.
# A line is spoken with its beat's `tags` if it has them (script.yaml), else with
# the tag for its mood below; narration with neither is read plainly.
# Changing any of this changes every affected recording's fingerprint, and
# the next recorder run re-records them.

model: eleven_v3
output_format: mp3_44100_64
settings: { stability: 0.5, similarity_boost: 0.75 }
word_voice: narrator     # who says a tapped word on its own

# mood -> the ElevenLabs v3 tag in front of the line
delivery_tags:
  calling:  shouting
  breezy:   casually
  wary:     hesitant
  curious:  curious
  sheepish: embarrassed
  annoyed:  annoyed
  proud:    proudly
  happy:    happy
  firm:     firmly
  sly:      mischievously
  shocked:  shocked
  amused:   amused
  weary:    tired
  stern:    stern

