    b06: { who: landlady, mood: stern, icons: [calendar], digits: "8" }
    b07: { who: dev, mood: annoyed, icons: [calendar], digits: "4", tags: [frustrated] }
    b08: { who: landlady, mood: sly, icons: [calendar, fish, "no"], digits: "6", tags: [firmly, mischievously], start: [landlady.smug] }
    b09: { who: dev, mood: weary, icons: [ok], tags: [sighs], start: [dev.sigh_nod] }
    b10: { who: landlady, mood: happy, icons: [house], start: [landlady.wave] }

