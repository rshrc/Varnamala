# s1e02: Advance. Who is where, and what happens, beat by beat.
# Format: stories/README.md

p1:
  set: pg_door
  ambient: quiet_lane
  cast:
    dev:      standing_bag @ 0.33
    landlady: arms_crossed @ 0.68
  beats:
    b01: { who: dev, mood: shocked, icons: [calendar, question], digits: "10", tags: [shocked], start: [dev.shock] }
    b02: { who: landlady, mood: stern, icons: [calendar], digits: "10" }
    b03: { who: dev, mood: firm, icons: [calendar], digits: "2" }
    b04: { who: landlady, mood: amused, icons: [calendar], digits: "9", tags: [chuckles, firmly], start: [landlady.laugh] }
