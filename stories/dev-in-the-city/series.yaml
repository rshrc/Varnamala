# Dev in the City: who is in it, and the cues every episode draws on.
# Format: stories/README.md
#
# A cue is "target move milliseconds", and can set off more cues after it:
#   meter.tap: meter tap 400 -> meter.broken 300, raju.laugh 800
# An episode that needs a cue timed differently redefines it in its own
# episode.yaml.

cast:
  dev:      { gender: male, pitch: 1.0, rate: 1.0 }
  raju:     { gender: male, pitch: 0.84, rate: 0.94 }
  landlady: { gender: female, pitch: 0.92, rate: 0.9 }
  chaiwala: { gender: male, pitch: 0.92, rate: 1.06 }
  priya:    { gender: female, pitch: 1.1, rate: 1.05 }
  boss:     { gender: male, pitch: 0.9, rate: 0.98 }
  kid:      { gender: female, pitch: 1.3, rate: 1.1 }
  son:      { gender: male, pitch: 0.96, rate: 1.08 }
  ivr:      { gender: female, pitch: 1.05, rate: 1.12 }
  amma:     { gender: female, pitch: 0.96, rate: 1.0 }
  daughter: { gender: female, pitch: 1.14, rate: 1.06 }

