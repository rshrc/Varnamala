name: words625
version: 0.1.0+1
publish_to: none
environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"
description: Varnamala - A Duolingo Alternative for Learning Indian Languages
dependencies:
  animated_text_kit: ^4.2.2
  audioplayers: any
  auto_route: ^11.2.0
  characters: any
  chiclet: any
  cloud_firestore: any
  contained_tab_bar_view: ^0.8.0
  countup: any
  cupertino_icons: ^1.0.2
  equatable: any
  firebase_analytics: any
  firebase_auth: any
  firebase_core: any
  firebase_crashlytics: any
  flutter:
    sdk: flutter
  flutter_animate: any
  flutter_custom_dialog: ^1.2.0
  flutter_riverpod: any
  flutter_svg: any
  flutter_tts: any
  flutter_web_plugins:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  freezed_annotation: ^3.1.0
  get_it: any
  google_fonts: ^6.2.0
  google_sign_in: any
  google_sign_in_web: ^1.1.3
  http: ^1.6.0
  injectable: ^3.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logger: any
  percent_indicator: ^4.0.0
  provider: any
  pulsator: any
  share_plus: ^12.0.2
  shimmer: any
  streaming_shared_preferences: any
  url_launcher: ^6.3.2
dev_dependencies:
  auto_route_generator: ^10.6.0
  # flutter_gen_runner 5.15 still uses package:build 4.x.
  build_runner: 2.16.1
  flutter_gen: ^5.15.0
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: any
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # auto_route_generator 10.6 currently requires analyzer <14.
  freezed: 4.0.1
  import_sorter: any
  injectable_generator: ^3.1.3
  json_serializable: ^6.15.2
  pubspec_dependency_sorter: any
  shared_preferences: any
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icons/
    - assets/images/
    - assets/images/mala/
    # One picture per concept taught by the First words course, shared by every
    # language: an apple is an apple in all thirteen.
    - assets/images/vocab/
    - assets/screens/
    - assets/emblems/
    # The concepts those pictures illustrate, and their English labels.
    - assets/courses/concepts.json
    # Course content, one directory of hand-editable JSON per language.
    - assets/courses/assamese/
    - assets/courses/gujarati/
    - assets/courses/bengali/
    - assets/courses/hindi/
    - assets/courses/kannada/
    - assets/courses/malayalam/
    - assets/courses/marathi/
    - assets/courses/nepali/
    - assets/courses/odia/
    - assets/courses/sanskrit/
    - assets/courses/tamil/
    - assets/courses/telugu/
    - assets/courses/urdu/
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/images/app_logo.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/images/app_logo.png
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: assets/images/app_logo.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/images/app_logo.png
