name: words625
version: 1.0.0+1
publish_to: none
environment:
  sdk: ">=3.2.3 <4.0.0"
description: Varnamala - A Duolingo Alternative for Learning Indian Languages
dependencies:
  animated_text_kit: ^4.2.2
  audioplayers: any
  auto_route: 9.2.2
  characters: any
  chiclet: any
  cloud_firestore: any
  contained_tab_bar_view: ^0.8.0
  countup: any
  cupertino_icons: ^1.0.2
  equatable: any
  firebase_analytics: any
  firebase_auth: any
  firebase_core: any
  firebase_crashlytics: any
  flutter:
    sdk: flutter
  flutter_animate: any
  flutter_custom_dialog: ^1.2.0
  flutter_svg: any
  flutter_tts: any
  font_awesome_flutter: any
  freezed: any
  get_it: any
  google_fonts: ^6.2.0
  google_sign_in: any
  injectable: any
  json_annotation: any
  json_serializable: any
  logger: any
  percent_indicator: ^4.0.0
  provider: any
  pulsator: any
  share_plus: ^12.0.2
  shimmer: any
  streaming_shared_preferences: any
  url_launcher: ^6.3.2
dev_dependencies:
  auto_route_generator: any
  build_runner: any
  flutter_animate: any
  flutter_gen: 5.8.0
  flutter_gen_runner: 5.8.0
  flutter_launcher_icons: any
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  import_sorter: any
  injectable_generator: any
  pubspec_dependency_sorter: any
  shared_preferences: any
  string_extension: any
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icons/
    - assets/images/
    - assets/images/mala/
    - assets/screens/
    - assets/emblems/
    # Course content, one directory of hand-editable JSON per language.
    - assets/courses/assamese/
    - assets/courses/gujarati/
    - assets/courses/bengali/
    - assets/courses/hindi/
    - assets/courses/kannada/
    - assets/courses/malayalam/
    - assets/courses/marathi/
    - assets/courses/nepali/
    - assets/courses/odia/
    - assets/courses/sanskrit/
    - assets/courses/tamil/
    - assets/courses/telugu/
    - assets/courses/urdu/
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/images/app_logo.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/images/app_logo.png
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: assets/images/app_logo.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/images/app_logo.png
